    <!-- PWA Service Worker Registration (Dev-safe & Cache-Busting) -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        (function () {
          var host = window.location.hostname || '';
          var isDev = host === 'localhost' || host === '127.0.0.1' || host.indexOf('ais-dev-') === 0;

          if (isDev) {
            var hadController = Boolean(navigator.serviceWorker.controller);
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              var promises = regs.map(function (r) { return r.unregister(); });
              if ('caches' in window) {
                caches.keys().then(function (keys) {
                  keys.forEach(function (k) { caches.delete(k); });
                });
              }
              Promise.all(promises).then(function () {
                if (hadController && !sessionStorage.getItem('sw_dev_cleaned')) {
                  sessionStorage.setItem('sw_dev_cleaned', '1');
                  window.location.reload();
                }
              });
            });
            return;
          }

          window.addEventListener('load', function () {
            var hadController = Boolean(navigator.serviceWorker.controller);
            navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
              .then(function (reg) {
                reg.update().catch(function () {});
              })
              .catch(function (err) {
                console.log('SW register notice:', err);
              });

            navigator.serviceWorker.addEventListener('controllerchange', function () {
              if (hadController && !sessionStorage.getItem('sw_reloaded_v4')) {
                sessionStorage.setItem('sw_reloaded_v4', '1');
                window.location.reload();
              }
            });
          });
        })();
      }
    </script>
