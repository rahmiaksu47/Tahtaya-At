<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a2d"/>
      <stop offset="100%" stop-color="#071322"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="188" height="188" rx="38" fill="none" stroke="#193654" stroke-width="2"/>
  <!-- Smartboard Frame -->
  <rect x="28" y="34" width="136" height="84" rx="12" fill="#10243b" stroke="url(#blueGrad)" stroke-width="4"/>
  <!-- Smartboard Stand Base -->
  <path d="M 82 118 L 74 146 M 110 118 L 118 146 M 64 146 L 128 146" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <!-- Screen Inner Glow / Canvas -->
  <rect x="38" y="44" width="116" height="64" rx="6" fill="#071322"/>
  <!-- Mobile Phone Device Overlay -->
  <rect x="110" y="80" width="46" height="74" rx="8" fill="#10243b" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
  <rect x="116" y="88" width="34" height="52" rx="4" fill="#0284c7"/>
  <!-- Wireless Wave Arcs -->
  <path d="M 62 64 A 16 16 0 0 1 84 86" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <path d="M 52 54 A 30 30 0 0 1 94 96" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 3"/>
  <circle cx="133" cy="146" r="2.5" fill="#ffffff"/>
</svg>
