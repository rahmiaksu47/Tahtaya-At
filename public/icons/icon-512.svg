      <stop offset="0%" stop-color="#0b1a2d"/>
      <stop offset="100%" stop-color="#071322"/>
    </linearGradient>
    <linearGradient id="blueGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bgGrad512)"/>
  <rect x="4" y="4" width="504" height="504" rx="104" fill="none" stroke="#193654" stroke-width="4"/>
